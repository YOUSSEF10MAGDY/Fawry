<div class="form-container">
  <h3>إضافة طبيب جديد</h3>

  <form (ngSubmit)="onSubmit()" [formGroup]="doctorForm">
    <div class="form-group">
      <label>اسم الطبيب:</label>
      <input class="form-control" formControlName="name" placeholder="مثال: أحمد محمد" type="text">
    </div>

    <div class="form-group">
      <label>التخصص:</label>
      <input class="form-control" formControlName="specialty" placeholder="مثال: أسنان، أطفال..." type="text">
    </div>

    <button [disabled]="doctorForm.invalid" class="submit-btn" type="submit">حفظ الطبيب</button>
  </form>

  @if (showSuccess) {
    <div class="success-message">تم إضافة الطبيب بنجاح!</div>
  }
</div>
